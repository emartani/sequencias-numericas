<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete a Sequência</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Luckiest Guy', cursive;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(135deg, #4caf50, #8bc34a);
      margin: 0;
    }
    h1 { color: #fff; text-shadow: 2px 2px #000; margin: 16px 0; }
    .instruction {
      font-size: 2em;
      margin: 10px;
      color: #ffeb3b;
      text-shadow: 3px 3px #000;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); color: #ffeb3b; }
      50% { transform: scale(1.08); color: #fff176; }
      100% { transform: scale(1); color: #ffeb3b; }
    }
    .score {
      font-size: 1.3em;
      color: #fff;
      text-shadow: 2px 2px #000;
      margin: 6px 0 12px;
    }
    .sequence { display: flex; justify-content: center; flex-wrap: wrap; margin: 20px; }
    .slot {
      background: #fff;
      border: 3px dashed #000;
      margin: 6px;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.6em;
      min-width: 50px;
      min-height: 50px;
    }
    .options { display: flex; justify-content: center; flex-wrap: wrap; margin: 20px; }
    .number {
      background: #ff5722;
      color: #fff;
      margin: 6px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1.4em;
      cursor: grab;
      box-shadow: 2px 2px #000;
    }
    .feedback { font-size: 1.2em; margin-top: 12px; color: #fff; text-shadow: 2px 2px #000; min-height: 34px; }
    button {
      font-size: 1.1em;
      margin: 10px;
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      background: #673ab7;
      color: #fff;
      cursor: pointer;
      box-shadow: 2px 2px #000;
    }
    button:hover { background: #9575cd; }

    .firework {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }
    @keyframes explode {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(20); opacity: 0; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6em; }
      .instruction { font-size: 1.3em; }
      .score { font-size: 1em; }
      .slot { font-size: 1.2em; padding: 10px; min-width: 40px; }
      .number { font-size: 1.1em; padding: 10px 14px; }
      button { font-size: 1em; padding: 8px 14px; }
    }
  </style>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WWGWM9FZ9Q"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-WWGWM9FZ9Q');
</script>

<body>
  <h1>Complete a Sequência</h1>
  <div id="instruction" class="instruction"></div>
  <div class="score">
    Fase: <span id="level">1</span> | Pontos: <span id="points">0</span> | Vidas: <span id="lives">3</span>
  </div>

  <div class="sequence" id="sequence"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button id="restartBtn">🔄 Reiniciar</button>

  <script>
    let level = 1;
    let points = 0;
    let lives = 3;
    let sequence = [];
    let missingIndex;
    let orderType;

    const instructionEl = document.getElementById("instruction");
    const sequenceEl = document.getElementById("sequence");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const levelEl = document.getElementById("level");
    const pointsEl = document.getElementById("points");
    const livesEl = document.getElementById("lives");
    const restartBtn = document.getElementById("restartBtn");

    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === "correct") { osc.type="triangle"; osc.frequency.value=600; gain.gain.value=0.2; }
      else if (type === "wrong") { osc.type="sawtooth"; osc.frequency.value=150; gain.gain.value=0.25; }
      else if (type === "win") { osc.type="square"; osc.frequency.value=800; gain.gain.value=0.3; }

      osc.start(); osc.stop(ctx.currentTime+0.35);
    }

    function createFirework(x,y){
      const fw=document.createElement("div");
      fw.className="firework";
      fw.style.left=x+"px"; fw.style.top=y+"px";
      fw.style.background=["red","yellow","blue","lime","purple"][Math.floor(Math.random()*5)];
      document.body.appendChild(fw);
      setTimeout(()=>fw.remove(),1000);
    }
    function launchFireworks(){
      for(let i=0;i<15;i++){
        setTimeout(()=>{
          const x=Math.random()*window.innerWidth;
          const y=Math.random()*window.innerHeight/2;
          createFirework(x,y);
        },i*180);
      }
    }

    function setupPhase(){
      const count = 6; // sempre 6 números
      orderType = Math.random()<0.5?"crescente":"decrescente";
      instructionEl.textContent = "Complete a sequência em ordem "+orderType.toUpperCase();

      // dificuldade aumenta com a fase
      const start = Math.floor(Math.random()*20 + level*5);
      const step = Math.floor(Math.random()*3 + level); // passo maior em fases avançadas
      sequence = Array.from({length:count},(_,i)=>start+i*step);
      if(orderType==="decrescente") sequence.reverse();

      missingIndex = Math.floor(Math.random()*count);

      sequenceEl.innerHTML="";
      sequence.forEach((num,i)=>{
        const slot=document.createElement("div");
        slot.className="slot";
        slot.textContent = i===missingIndex?"?":num;
        sequenceEl.appendChild(slot);
      });

      optionsEl.innerHTML="";
      const correct=sequence[missingIndex];
      const choices=new Set([correct]);
      while(choices.size<4){
        choices.add(Math.floor(Math.random()*100));
      }
      [...choices].sort(()=>Math.random()-0.5).forEach(num=>{
        const div=document.createElement("div");
        div.textContent=num;
        div.className="number";
        div.draggable=true;
        div.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",String(num)));
        optionsEl.appendChild(div);
      });

      feedbackEl.textContent="";
      levelEl.textContent = level;
      pointsEl.textContent = points;
      livesEl.textContent = lives;
    }

    sequenceEl.addEventListener("dragover",e=>e.preventDefault());
    sequenceEl.addEventListener("drop",e=>{
      e.preventDefault();
      const num=parseInt(e.dataTransfer.getData("text/plain"),10);
      if(num===sequence[missingIndex]){
        sequenceEl.children[missingIndex].textContent=num;
        playSound("correct");
        points+=10;
        pointsEl.textContent=points;
        feedbackEl.textContent="🎉 Correto!";
                if(level<5){
          level++;
          levelEl.textContent=level;
          setTimeout(setupPhase,1500);
        } else {
          feedbackEl.textContent="🏆 Parabéns! Você completou todas as fases!";
          playSound("win");
          launchFireworks();
        }
      } else {
        playSound("wrong");
        lives--;
        livesEl.textContent = lives;
        feedbackEl.textContent="❌ Ops! Número errado!";
        if(lives<=0){
          feedbackEl.textContent="💀 Game Over! Clique em Reiniciar para tentar novamente.";
        }
      }
    });

    function restartGame(){
      level=1; points=0; lives=3;
      levelEl.textContent=level;
      pointsEl.textContent=points;
      livesEl.textContent=lives;
      setupPhase();
    }
    restartBtn.addEventListener("click", restartGame);

    // iniciar jogo
    setupPhase();
  </script>
</body>
</html>
